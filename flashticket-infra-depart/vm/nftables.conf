#!/usr/sbin/nft -f
# Pare-feu FlashTicket (version du cours, à adapter pour le TD).
#
# Modèle : politique par défaut = refuser. On ouvre uniquement :
#   - SSH (22) depuis le segment public
#   - ticketpdf (8443) depuis le segment applicatif
#
# >>> À ADAPTER : dans la VM du TD, vos connexions SSH n'arrivent pas du
# >>> réseau 10.0.1.0/24 mais de l'adresse de votre machine hôte
# >>> (ex. 192.168.64.0/24 avec Multipass sous macOS, 10.0.2.0/24 sous Linux).
# >>> Vérifiez avec :  ip route get <ip_hote>   et   who   (colonne adresse)
# >>> AVANT de charger ces règles, et gardez une seconde session ouverte.

flush ruleset

define PUBLIC_NET = 10.97.0.0/24
define APP_NET    = 10.0.2.0/24

table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;

    iif lo accept
    ct state established,related accept
    ct state invalid drop

    ip protocol icmp accept
    ip6 nexthdr icmpv6 accept

    ip saddr $PUBLIC_NET tcp dport 22 ct state new limit rate 10/minute accept
    ip saddr $APP_NET    tcp dport 8443 accept

    counter drop
  }
  chain forward {
    type filter hook forward priority 0; policy drop;
  }
  chain output {
    type filter hook output priority 0; policy accept;
  }
}
